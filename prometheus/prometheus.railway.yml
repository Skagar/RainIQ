global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service.railway.internal:8080']

  - job_name: 'design-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['design-service.railway.internal:8081']

  - job_name: 'property-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['property-service.railway.internal:8082']

  - job_name: 'rainfall-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['rainfall-service.railway.internal:8083']

  - job_name: 'compliance-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['compliance-service.railway.internal:8084']

  - job_name: 'monitoring-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['monitoring-service.railway.internal:8085']

  - job_name: 'ai-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ai-service.railway.internal:8086']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service.railway.internal:8087']