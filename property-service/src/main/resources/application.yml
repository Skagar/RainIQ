server:
  port: 8082

spring:
  application:
    name: property-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rainiq_property}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:rainiq123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

  jwt:
    secret: ${JWT_SECRET:thisIsAVeryLongSecretKeyForRainIQProjectThatIsAtLeast256BitsLong}

eureka:
  client:
    service-url:
      defaultZone:   ${EUREKA_URI:http://localhost:8761/eureka}