services:
  ai-service:
    image: skagar/ai-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rainiq_ai
      EUREKA_URI: http://eureka-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GEMINI_API_KEY: AQ:Ab8RN6K1Ae4dUgsRshSZzlLbkEj6PjJcOXEkDlTuQrtZgur2ZA
    depends_on:
      - postgres
      - eureka-server
      - kafka
    ports:
      - "8086:8086"
  auth-service:
    image: skagar/auth-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rainiq_auth
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      - postgres
      - eureka-server
    ports:
      - "8080:8080"
  compliance-service:
    image: skagar/compliance-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rainiq_compliance
      EUREKA_URI: http://eureka-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - eureka-server
      - kafka
    ports:
      - "8084:8084"
  design-service:
    image: skagar/design-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rainiq_design
      EUREKA_URI: http://eureka-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - eureka-server
      - kafka
    ports:
      - "8081:8081"
  monitoring-service:
    image: skagar/monitoring-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rainiq_monitoring
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      - postgres
      - eureka-server
    ports:
      - "8085:8085"
  notification-service:
    image: skagar/notification-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rainiq_notification
      EUREKA_URI: http://eureka-server:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_APP_PASSWORD: agns lvlp bjva czlj
    depends_on:
      - postgres
      - eureka-server
      - kafka
    ports:
      - "8087:8087"
  property-service:
    image: skagar/property-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rainiq_property
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      - postgres
      - eureka-server
    ports:
      - "8082:8082"
  rainfall-service:
    image: skagar/rainfall-service:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rainiq_rainfall
      EUREKA_URI: http://eureka-server:8761/eureka
      GEOCODING_API_KEY: 6a3a5858589cc617535788zsb56714d
    depends_on:
      - postgres
      - eureka-server
    ports:
      - "8083:8083"
  eureka-server:
    image: skagar/eureka-server:latest
    ports:
      - "8761:8761"
  api-gateway:
    image: skagar/api-gateway:latest
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
    ports:
      - "8182:8182"
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka

    ports:
      - "9092:9092"  

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data
  postgres:
    image: postgres:16
    container_name: rainiq-postgres
    ports:
    - "5432:5432"
    environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: rainiq123
     TZ: Asia/Kolkata
     PGTZ: Asia/Kolkata
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
  prometheus:
    image: prom/prometheus:latest
    container_name: rainiq-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:latest
    container_name: rainiq-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  kafka-data:
  postgres-data:
  grafana-data: