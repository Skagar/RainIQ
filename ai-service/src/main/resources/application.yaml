server:
  port: 8086
spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://localhost:5432/rainiq_ai
    username: postgres
    password: rainiq123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: my-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDesrializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDesrializer
      properties:
        spring.json.trusted.packages: "*"
        spring .json.value.default.type: com.rainiq.aiservice.event.ComplianceCompletedEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
springdoc:
